[package]
name = "writer"
version = "0.1.0"
description = "Writer - 本地优先的个人桌面写作软件"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique vs the bin name on Windows.
name = "writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
blake3 = "1"
encoding_rs = "0.8"
# M3 同步：WebDAV 客户端（唯一网络出口 NetGateway 的执行层）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
# M3 同步：sync_state.db / 墓碑去重 / 同步历史
rusqlite = { version = "0.37", features = ["bundled"] }
# M3 同步：凭据 DPAPI 加密（NFR-08：前端永不接触明文）
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
# PDF 渲染舱（FR-EXP-05）：WebView2 PrintToPdf COM 绑定，版本随 wry 锁定
webview2-com = "0.39"
windows-core = "0.62"

# See the optimization guideline for more details: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
